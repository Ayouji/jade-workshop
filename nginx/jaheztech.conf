server {
    listen 80;
    listen [::]:80;
    server_name jaheztech.com www.jaheztech.com;

    # Logs Nginx
    access_log /var/log/nginx/jaheztech_access.log;
    error_log /var/log/nginx/jaheztech_error.log;

    # Taille max des uploads (ex: images d'ateliers)
    client_max_body_size 25M;

    # Reverse Proxy vers le conteneur Next.js (port local 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Support des WebSockets et Server Actions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # En-têtes réels du client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Optimisation du cache pour les fichiers statiques Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimisation pour les images et assets publics
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }
}
